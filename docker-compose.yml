services:
  jachai-backend:
    container_name: jachai-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-false}
      BOOTSTRAP_DATABASE_ON_STARTUP: ${BOOTSTRAP_DATABASE_ON_STARTUP:-false}
      WARM_EMBEDDING_MODEL_ON_STARTUP: ${WARM_EMBEDDING_MODEL_ON_STARTUP:-false}
      # This compose file assumes PostgreSQL and Redis are already running
      # and are provided through DATABASE_URL / REDIS_URL in backend/.env.
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
      WAIT_FOR_SERVICES: ${WAIT_FOR_SERVICES:-true}
      WAIT_TIMEOUT_SECONDS: ${WAIT_TIMEOUT_SECONDS:-75}
      HF_HOME: /data/huggingface
      SENTENCE_TRANSFORMERS_HOME: /data/sentence-transformers
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - jachai_backend_model_cache:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  jachai_backend_model_cache:
